<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org;">
  <title>POTACAT Logbook</title>
  <script src="popout-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); }
    body { display: flex; flex-direction: column; color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }

    .qso-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 6px 10px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary);
    }
    .qso-toolbar input {
      flex: 1; padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--border-primary);
      border-radius: 4px; color: var(--text-primary); font-size: 12px;
    }
    .qso-toolbar input:focus { outline: none; border-color: var(--accent-blue); }
    .qso-count { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
    .qso-export-btn {
      border: 1px solid var(--accent-green, #4ecca3); color: var(--accent-green, #4ecca3);
      background: transparent; padding: 3px 10px; border-radius: 4px; cursor: pointer;
      font-size: 11px; white-space: nowrap;
    }
    .qso-export-btn:hover { background: var(--accent-green, #4ecca3); color: #fff; }

    .qso-body { flex: 1; overflow-y: auto; min-height: 0; }

    .qso-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .qso-table th {
      text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border-primary);
      color: var(--text-secondary); font-size: 11px; white-space: nowrap;
      position: sticky; top: 0; background: var(--bg-secondary); z-index: 1;
    }
    .qso-table th[data-sort] { cursor: pointer; user-select: none; }
    .qso-table th[data-sort]:hover { color: var(--accent-blue); }
    .qso-table th.sort-asc::after { content: ' \25B2'; font-size: 9px; }
    .qso-table th.sort-desc::after { content: ' \25BC'; font-size: 9px; }
    .qso-table td { padding: 3px 6px; white-space: nowrap; border-bottom: 1px solid var(--border-secondary); height: 20px; box-sizing: content-box; }
    .qso-table td.col-COMMENT { white-space: normal; word-break: break-word; }
    .qso-table tr:last-child td { border-bottom: none; }
    .qso-table td.editable { cursor: text; }
    .qso-table tbody tr { cursor: pointer; }
    .qso-table tbody tr.selected { background: color-mix(in srgb, var(--accent-blue) 20%, transparent); }

    /* ── Per-column color coding ──
       Columns map to the --log-* palette in styles.css, which themes
       itself for light/dark (Park stays green on every theme). Applied
       to td (not th) so headers stay neutral. Kept above the .selected
       rule's reach so colors persist when a row is selected — the blue
       background tint is enough to signal selection. */
    .qso-table td.col-QSO_DATE { color: var(--log-date); }
    .qso-table td.col-TIME_ON  { color: var(--log-time); }
    .qso-table td.col-CALL     { color: var(--log-call); font-weight: 600; }
    .qso-table td.col-FREQ     { color: var(--log-freq); }
    .qso-table td.col-MODE     { color: var(--log-mode); }
    .qso-table td.col-BAND     { color: var(--log-band); }
    .qso-table td.col-TX_PWR,
    .qso-table td.col-RST_SENT,
    .qso-table td.col-RST_RCVD { color: var(--log-rst); }
    .qso-table td.col-SIG_INFO,
    .qso-table td.col-MY_SIG_INFO { color: var(--log-park); font-weight: 600; }
    .qso-table td.col-GRIDSQUARE,
    .qso-table td.col-STATE,
    .qso-table td.col-COUNTRY  { color: var(--log-region); }
    .qso-table td.col-QSL      { color: var(--log-park); font-weight: 600;
                                 white-space: nowrap; cursor: pointer; }
    .qso-table td.col-COMMENT  { color: var(--log-notes); }
    /* Fixed layout is what makes a dragged column edge mean anything: with
       auto layout the browser sizes to content and ignores the width. Cells
       clip instead of pushing their neighbours around. */
    .qso-table { table-layout: fixed; }
    .qso-table td { overflow: hidden; text-overflow: ellipsis; }
    .qso-table th { position: relative; overflow: hidden; }
    .qso-table th.col-dragging { opacity: 0.5; }
    .qso-table th.col-drop { box-shadow: inset 2px 0 0 var(--accent-blue); }
    .col-resize {
      position: absolute; top: 0; right: 0; width: 6px; height: 100%;
      cursor: col-resize; user-select: none;
    }
    .col-resize:hover { background: var(--accent-blue); opacity: 0.6; }
    /* Column picker (right-click the header) */
    .qso-col-menu {
      position: fixed; z-index: 60; min-width: 150px; padding: 4px;
      background: var(--bg-panel); border: 1px solid var(--border-primary);
      border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      font-size: 12px; max-height: 70vh; overflow-y: auto;
    }
    .qso-col-menu.hidden { display: none; }
    .qso-col-menu-row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; cursor: pointer; white-space: nowrap;
    }
    .qso-col-menu-row:hover { background: var(--bg-hover); }
    .qso-col-menu-reset {
      width: 100%; margin-top: 4px; padding: 4px;
      background: var(--bg-input); color: var(--text-primary);
      border: 1px solid var(--border-primary); border-radius: 3px; cursor: pointer;
    }
    .qso-table td input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--accent-blue);
      color: var(--text-primary); padding: 1px 4px; font-size: inherit;
      font-family: inherit; box-sizing: border-box;
    }

    .qso-empty { text-align: center; color: var(--text-tertiary); margin: 40px 0; }

    .qso-footer {
      padding: 6px 10px; font-size: 11px; color: var(--text-tertiary);
      background: var(--bg-secondary); border-top: 1px solid var(--border-primary);
      display: flex; flex-direction: column; gap: 4px;
    }
    .qso-stats { display: flex; flex-wrap: wrap; gap: 4px 8px; }
    .qso-footer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .qso-path-wrap { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qso-footer a { color: var(--accent-blue); }

    .qso-toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--bg-header); color: var(--text-primary); padding: 6px 16px;
      border-radius: 4px; font-size: 12px; border: 1px solid var(--border-primary);
      z-index: 10000; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .qso-toast.show { opacity: 1; }

    /* --- Filter bar --- */
    .qso-filter-bar {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary);
      font-size: 11px; flex-wrap: wrap;
    }
    .qso-filter-bar label { color: var(--text-tertiary); white-space: nowrap; }
    .qso-filter-bar select, .qso-filter-bar input[type="date"] {
      padding: 2px 4px; background: var(--bg-input); border: 1px solid var(--border-primary);
      border-radius: 3px; color: var(--text-primary); font-size: 11px;
    }
    .qso-filter-bar select:focus, .qso-filter-bar input[type="date"]:focus { outline: none; border-color: var(--accent-blue); }
    .qso-filter-btn {
      border: 1px solid var(--border-primary); color: var(--text-secondary);
      background: transparent; padding: 2px 8px; border-radius: 3px; cursor: pointer;
      font-size: 11px; white-space: nowrap;
    }
    .qso-filter-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
    .qso-filter-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(79,195,247,0.1); }
    .qso-clear-btn { color: var(--text-tertiary); cursor: pointer; background: transparent; border: none; font-size: 11px; }
    .qso-clear-btn:hover { color: var(--text-primary); }

    /* --- Map split pane --- */
    #qso-map-splitter {
      display: none; height: 5px; background: var(--border-primary); cursor: row-resize;
      flex-shrink: 0;
    }
    #qso-map-splitter:hover { background: var(--accent-blue); }
    #qso-map-container { display: none; flex-shrink: 0; overflow: hidden; }
    #qso-map { width: 100%; height: 100%; }
    body.map-visible #qso-map-splitter { display: block; }
    body.map-visible #qso-map-container { display: block; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">POTACAT Logbook</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="tb-min" title="Minimize">&#x2014;</button>
      <button class="titlebar-btn" id="tb-max" title="Maximize">&#x25A1;</button>
      <button class="titlebar-btn titlebar-close" id="tb-close" title="Close">&#x2715;</button>
    </div>
  </div>

  <div class="qso-toolbar">
    <input type="text" id="qso-search" placeholder="Search callsign, park, notes..." autocomplete="off">
    <span class="qso-count" id="qso-count"></span>
    <button class="qso-export-btn" id="qso-new" style="background:var(--accent-green,#4ecca3);color:#000;font-weight:600;">+ New QSO</button>
    <button class="qso-export-btn" id="qso-import">Import ADIF</button>
    <button class="qso-export-btn" id="qso-export">Export ADIF</button>
    <button class="qso-export-btn" id="qso-resend" title="Resend visible QSOs to configured logbook">Resend to Logbook</button>
  </div>

  <!-- New QSO inline form -->
  <div id="qso-new-form" class="hidden" style="padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border-primary);font-size:11px;">
    <!-- Row 1: Callsign / Freq / Mode / RST -->
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <input type="text" id="qso-new-call" placeholder="Callsign" style="width:80px;font-size:11px;padding:2px 4px;text-transform:uppercase;" spellcheck="false" autocomplete="off">
      <input type="text" id="qso-new-freq" placeholder="Freq kHz" style="width:70px;font-size:11px;padding:2px 4px;">
      <select id="qso-new-mode" style="font-size:11px;padding:2px 4px;">
        <option>SSB</option><option>CW</option><option>FT8</option><option>FT4</option><option>PSK31</option><option>FM</option><option>AM</option><option>RTTY</option><option>DIGI</option>
      </select>
      <input type="text" id="qso-new-rst-s" placeholder="RST S" value="59" style="width:40px;font-size:11px;padding:2px 4px;">
      <input type="text" id="qso-new-rst-r" placeholder="RST R" value="59" style="width:40px;font-size:11px;padding:2px 4px;">
      <input type="text" id="qso-new-comment" placeholder="Notes" style="flex:1;min-width:120px;font-size:11px;padding:2px 4px;">
    </div>
    <!-- Row 2: Type chips / Reference / Respot -->
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;">
      <div id="qso-new-type-chips" style="display:flex;gap:3px;">
        <button type="button" class="qnt-chip active" data-type="dx">DX</button>
        <button type="button" class="qnt-chip" data-type="pota">POTA</button>
        <button type="button" class="qnt-chip" data-type="sota">SOTA</button>
        <button type="button" class="qnt-chip" data-type="wwff">WWFF</button>
        <button type="button" class="qnt-chip" data-type="llota">LLOTA</button>
        <button type="button" class="qnt-chip" data-type="tiles">Tiles</button>
      </div>
      <input type="text" id="qso-new-ref" placeholder="Reference" class="hidden" style="width:110px;font-size:11px;padding:2px 4px;text-transform:uppercase;" spellcheck="false" autocomplete="off">
      <label id="qso-new-respot-label" class="hidden" style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary);cursor:pointer;">
        <input type="checkbox" id="qso-new-respot" checked style="margin:0;">
        Re-spot on save
      </label>
      <span id="qso-new-respot-hint" class="hidden" style="font-size:10px;color:var(--text-tertiary);font-style:italic;"></span>
      <span style="flex:1;"></span>
      <button type="button" id="qso-new-save" style="font-size:11px;padding:2px 10px;background:var(--accent-green-btn,#4ecca3);color:#000;border:none;border-radius:3px;font-weight:600;cursor:pointer;">Log</button>
      <button type="button" id="qso-new-cancel" style="font-size:11px;padding:2px 8px;background:none;color:var(--text-secondary);border:1px solid var(--border-primary);border-radius:3px;cursor:pointer;">Cancel</button>
    </div>
  </div>
  <style>
    .qnt-chip {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg-input);
      color: var(--text-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 11px;
      cursor: pointer;
    }
    .qnt-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
    .qnt-chip.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
  </style>

  <div class="qso-filter-bar" id="qso-filter-bar">
    <label>Band</label>
    <select id="qso-filter-band">
      <option value="">All</option>
      <option>160m</option><option>80m</option><option>60m</option><option>40m</option>
      <option>30m</option><option>20m</option><option>17m</option><option>15m</option>
      <option>12m</option><option>10m</option><option>6m</option><option>2m</option><option>70cm</option>
    </select>
    <label>Mode</label>
    <select id="qso-filter-mode">
      <option value="">All</option>
      <option>CW</option><option>SSB</option><option>FT8</option><option>FT4</option><option>FT2</option>
      <option title="PSK31/63/125 log as MODE=PSK with a SUBMODE">PSK</option>
      <option>FM</option><option>RTTY</option><option>AM</option><option>DIGI</option>
    </select>
    <label>Region</label>
    <select id="qso-filter-region">
      <option value="">All</option>
      <option>AF</option><option>AS</option><option>EU</option>
      <option>NA</option><option>OC</option><option>SA</option>
    </select>
    <label>From</label>
    <input type="date" id="qso-filter-from">
    <label>To</label>
    <input type="date" id="qso-filter-to">
    <button class="qso-filter-btn" id="qso-map-toggle" title="Show map">Map</button>
    <button class="qso-clear-btn" id="qso-filter-clear" title="Clear all filters">Clear</button>
  </div>

  <div class="qso-body" id="qso-body">
    <table class="qso-table" id="qso-table">
      <thead>
        <tr id="qso-head-row"></tr>
      </thead>
      <tbody id="qso-tbody"></tbody>
    </table>
    <p class="qso-empty hidden" id="qso-empty">No QSOs logged yet</p>
  </div>

  <!-- Column picker: right-click the header (same gesture as the Spots table) -->
  <div id="qso-col-menu" class="qso-col-menu hidden"></div>

  <div id="qso-map-splitter"></div>
  <div id="qso-map-container"><div id="qso-map"></div></div>

  <div class="qso-footer">
    <div class="qso-stats">
      <span id="qso-stat-total"></span>
      <span class="stat-sep">|</span>
      <span id="qso-stat-calls"></span>
      <span class="stat-sep">|</span>
      <span id="qso-stat-bands"></span>
      <span class="stat-sep">|</span>
      <span id="qso-stat-modes"></span>
    </div>
    <div class="qso-footer-row">
      <span class="qso-path-wrap" id="qso-path-wrap" title="">Log: <a href="#" id="qso-path-link"></a></span>
    </div>
  </div>

  <div class="qso-toast" id="qso-toast"></div>

  <script src="../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="qso-popout.js"></script>
</body>
</html>
