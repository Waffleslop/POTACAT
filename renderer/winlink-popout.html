<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>POTACAT — Winlink Mail</title>
  <script src="popout-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; }
    body { display: flex; flex-direction: column; }
    button, select, input, textarea { font: inherit; }

    .wl-titlebar { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary); font-size: 12px; flex-shrink: 0; }
    .wl-title { font-weight: 700; color: var(--accent-blue, #4fc3f7); }
    .wl-spacer { flex: 1; }
    .wl-winbtn { -webkit-app-region: no-drag; width: 26px; height: 20px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 3px; }
    .wl-winbtn:hover { background: var(--bg-hover); }
    .wl-winbtn.close:hover { background: var(--accent-red, #e94560); color: #fff; }
    .platform-darwin .wl-titlebar { padding-left: 80px; }
    .platform-darwin .wl-winbtn { display: none; }

    .wl-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border-primary); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; white-space: nowrap; }
    .wl-btn:hover:not(:disabled) { background: var(--bg-hover); }
    .wl-btn:disabled { opacity: 0.45; cursor: default; }
    .wl-btn.primary { border-color: var(--accent-green, #4ecca3); color: var(--accent-green, #4ecca3); }
    .wl-btn.danger { border-color: #e94560; color: #e94560; }
    select, input[type=text], textarea { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary); border-radius: 4px; padding: 3px 5px; }

    /* Connect bar */
    .wl-connbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary); flex-shrink: 0; font-size: 12px; }
    .wl-connbar label { color: var(--text-dim); }
    .wl-mycall { font-family: monospace; font-weight: 700; color: var(--accent-green, #4ecca3); }
    #wl-gateway { min-width: 260px; max-width: 420px; }
    .wl-mode-note { color: #f0a500; font-size: 11px; }

    /* Session strip */
    .wl-session { display: flex; gap: 12px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--border-primary); font-size: 12px; color: var(--text-dim); flex-shrink: 0; min-height: 20px; }
    .wl-state { font-weight: 700; text-transform: uppercase; font-size: 11px; }
    .wl-state.idle, .wl-state.done { color: var(--text-dim); }
    .wl-state.starting, .wl-state.connecting, .wl-state.disconnecting { color: #f0a500; }
    .wl-state.connected { color: var(--accent-green, #4ecca3); }
    .wl-state.error { color: #e94560; }
    .wl-ptt { padding: 0 6px; border-radius: 3px; font-weight: 700; font-size: 11px; }
    .wl-ptt.on { background: var(--accent-red, #e94560); color: #fff; }
    .wl-bar { flex: 0 0 120px; height: 6px; background: var(--bg-tertiary, #2a2a40); border-radius: 3px; overflow: hidden; }
    .wl-bar > div { height: 100%; width: 0; background: var(--accent-blue, #4fc3f7); }
    .wl-text { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .wl-prompt { display: none; gap: 6px; align-items: center; padding: 6px 10px; background: #3a2f10; color: #f0c040; border-bottom: 1px solid var(--border-primary); font-size: 12px; }
    .wl-prompt.show { display: flex; }
    .light .wl-prompt { background: #fff4d6; color: #7a5600; }

    /* Body */
    .wl-main { flex: 1; display: flex; min-height: 0; }
    .wl-folders { width: 130px; flex-shrink: 0; border-right: 1px solid var(--border-primary); padding: 6px 0; display: flex; flex-direction: column; gap: 2px; background: var(--bg-secondary); }
    .wl-folder { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; }
    .wl-folder:hover { background: var(--bg-hover); }
    .wl-folder.active { background: var(--bg-hover); font-weight: 700; color: var(--accent-blue, #4fc3f7); }
    .wl-count { color: var(--text-dim); font-size: 11px; }
    .wl-count.unread { color: var(--accent-green, #4ecca3); font-weight: 700; }
    .wl-folders .wl-btn { margin: 6px 10px 0; }

    .wl-list { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border-primary); overflow-y: auto; }
    .wl-row { padding: 6px 10px; border-bottom: 1px solid var(--border-primary); cursor: pointer; }
    .wl-row:hover { background: var(--bg-hover); }
    .wl-row.active { background: var(--bg-hover); box-shadow: inset 3px 0 0 var(--accent-blue, #4fc3f7); }
    .wl-row.unread .wl-subj { font-weight: 700; }
    .wl-row-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--text-dim); }
    .wl-from { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
    .wl-subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wl-empty { padding: 20px; color: var(--text-dim); text-align: center; }

    .wl-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .wl-reader { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .wl-hdr { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.6; }
    .wl-hdr b { color: var(--text-primary); }
    .wl-body { white-space: pre-wrap; word-break: break-word; font-family: monospace; user-select: text; }
    .wl-attach { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .wl-reader-actions { display: flex; gap: 6px; margin-bottom: 8px; }

    .wl-compose { display: none; flex-direction: column; gap: 6px; padding: 10px 14px; flex: 1; min-height: 0; }
    .wl-compose.show { display: flex; }
    .wl-compose .wl-field { display: flex; gap: 6px; align-items: center; }
    .wl-compose .wl-field label { width: 56px; color: var(--text-dim); font-size: 12px; }
    .wl-compose .wl-field input { flex: 1; }
    #wl-c-body { flex: 1; resize: none; font-family: monospace; min-height: 120px; }
    .wl-c-files { font-size: 12px; color: var(--text-dim); }
    .wl-c-err { color: #e94560; font-size: 12px; min-height: 16px; }

    /* Notice gate */
    .wl-notice { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
    .wl-notice.show { display: flex; }
    .wl-notice-card { max-width: 460px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 8px; padding: 16px 18px; line-height: 1.5; }
    .wl-notice-card h3 { margin: 0 0 8px; color: var(--accent-blue, #4fc3f7); font-size: 15px; }
    .wl-off { padding: 30px; text-align: center; color: var(--text-dim); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wl-titlebar">
    <span class="wl-title">Winlink Mail</span>
    <span class="wl-mycall" id="wl-mycall">—</span>
    <span class="wl-spacer"></span>
    <button class="wl-winbtn" id="wl-min" title="Minimize">&#8211;</button>
    <button class="wl-winbtn" id="wl-max" title="Maximize">&#9633;</button>
    <button class="wl-winbtn close" id="wl-close" title="Close">&#10005;</button>
  </div>

  <div class="wl-connbar">
    <label for="wl-mode">Send via</label>
    <select id="wl-mode"></select>
    <span id="wl-radio-pick" style="display:none;align-items:center;gap:6px;">
      <label for="wl-band">Band</label>
      <select id="wl-band">
        <option value="">All</option>
        <option>80m</option><option>60m</option><option>40m</option><option>30m</option><option>20m</option><option>17m</option><option>15m</option><option>12m</option><option>10m</option>
      </select>
      <select id="wl-gateway" title="Gateways, nearest or best-predicted first"><option value="">Load gateways…</option></select>
      <button class="wl-btn" id="wl-gw-refresh" title="Fetch the gateway list">&#8635;</button>
    </span>
    <button class="wl-btn primary" id="wl-connect">Send / Receive</button>
    <button class="wl-btn danger" id="wl-abort" disabled>Abort</button>
    <span class="wl-mode-note" id="wl-mode-note"></span>
  </div>

  <div class="wl-session">
    <span class="wl-state idle" id="wl-state">idle</span>
    <span class="wl-ptt" id="wl-ptt"></span>
    <div class="wl-bar"><div id="wl-bar"></div></div>
    <span class="wl-text" id="wl-text"></span>
    <span id="wl-remaining"></span>
  </div>
  <div class="wl-prompt" id="wl-prompt">
    <span id="wl-prompt-text"></span>
    <span class="wl-spacer"></span>
    <button class="wl-btn" id="wl-prompt-yes"></button>
    <button class="wl-btn" id="wl-prompt-no"></button>
  </div>

  <div class="wl-main" id="wl-main">
    <div class="wl-folders">
      <div class="wl-folder active" data-box="in">Inbox <span class="wl-count" id="wl-c-in"></span></div>
      <div class="wl-folder" data-box="out">Outbox <span class="wl-count" id="wl-c-out"></span></div>
      <div class="wl-folder" data-box="sent">Sent <span class="wl-count" id="wl-c-sent"></span></div>
      <div class="wl-folder" data-box="archive">Archive <span class="wl-count" id="wl-c-archive"></span></div>
      <button class="wl-btn primary" id="wl-new">New message</button>
      <button class="wl-btn" id="wl-pos" title="Queue a position report from your grid square">Position report</button>
      <span class="wl-spacer"></span>
      <button class="wl-btn" id="wl-settings">Settings</button>
    </div>
    <div class="wl-list" id="wl-list"></div>
    <div class="wl-pane">
      <div class="wl-reader" id="wl-reader"><div class="wl-empty">Pick a message.</div></div>
      <div class="wl-compose" id="wl-compose">
        <div class="wl-field"><label for="wl-c-to">To</label><input type="text" id="wl-c-to" placeholder="callsign or email, separated by commas"></div>
        <div class="wl-field"><label for="wl-c-cc">Cc</label><input type="text" id="wl-c-cc"></div>
        <div class="wl-field"><label for="wl-c-subj">Subject</label><input type="text" id="wl-c-subj" maxlength="128"></div>
        <textarea id="wl-c-body" spellcheck="true" placeholder="Plain text. Keep it short over HF."></textarea>
        <div class="wl-field"><button class="wl-btn" id="wl-c-attach">Attach…</button><span class="wl-c-files" id="wl-c-files"></span></div>
        <div class="wl-c-err" id="wl-c-err"></div>
        <div class="wl-field"><span class="wl-spacer"></span><button class="wl-btn" id="wl-c-cancel">Cancel</button><button class="wl-btn primary" id="wl-c-send">Put in Outbox</button></div>
      </div>
    </div>
  </div>
  <div class="wl-off" id="wl-off" style="display:none"></div>

  <div class="wl-notice" id="wl-notice">
    <div class="wl-notice-card">
      <h3>Before you send</h3>
      <p id="wl-notice-text"></p>
      <p style="color:var(--text-dim);font-size:12px;">Over the radio, POTACAT tunes and keys only when you press Send / Receive, and you stay in control of the station for the whole session.</p>
      <div style="display:flex;gap:6px;justify-content:flex-end;"><button class="wl-btn" id="wl-notice-no">Not now</button><button class="wl-btn primary" id="wl-notice-ok">I understand</button></div>
    </div>
  </div>

  <script src="winlink-popout.js"></script>
</body>
</html>
