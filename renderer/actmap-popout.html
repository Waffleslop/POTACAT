<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org;">
  <title>Activation</title>
  <script src="popout-theme-bootstrap.js"></script>
  <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); }
    body { display: flex; flex-direction: column; }
    .act-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 6px 10px;
      border-bottom: 1px solid var(--border-secondary); font-size: 12px; color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .act-park { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .act-count { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .act-count.valid { color: var(--source-pota, #4ecca3); font-weight: 600; }
    .act-seg { display: inline-flex; border: 1px solid var(--border-secondary); border-radius: 4px; overflow: hidden; margin-left: auto; }
    .act-seg button, .act-btn {
      background: var(--bg-panel); color: var(--text-secondary); border: 0; padding: 3px 10px; font-size: 12px; cursor: pointer;
    }
    .act-seg button + button { border-left: 1px solid var(--border-secondary); }
    .act-seg button.active { background: var(--accent-blue, #4fc3f7); color: var(--bg-primary); }
    .act-btn { border: 1px solid var(--border-secondary); border-radius: 4px; }
    .act-btn:hover, .act-seg button:hover:not(.active) { color: var(--text-primary); }
    .act-status { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }

    #act-main { flex: 1; min-height: 0; display: flex; }
    #map-pane { flex: 1; position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; }
    #log-pane { width: 470px; border-left: 1px solid var(--border-secondary); overflow-y: auto; min-width: 0; }
    body[data-view="map"] #log-pane { display: none; }
    body[data-view="log"] #map-pane { display: none; }
    body[data-view="log"] #log-pane { width: auto; flex: 1; border-left: 0; }
    @media (max-width: 720px) {
      body[data-view="both"] #act-main { flex-direction: column; }
      body[data-view="both"] #log-pane { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--border-secondary); }
    }

    .act-log { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
    .act-log th {
      position: sticky; top: 0; background: var(--bg-primary); text-align: left; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-tertiary); padding: 5px 6px;
      border-bottom: 1px solid var(--border-secondary);
    }
    .act-log td { padding: 4px 6px; border-bottom: 1px solid var(--border-secondary); color: var(--text-secondary); white-space: nowrap; overflow: visible; text-overflow: clip; max-width: none; }
    .act-log td.call { color: var(--text-primary); font-weight: 600; }
    .act-log td.num, .act-log td.time { font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
    .act-log .p2p { font-size: 9px; font-weight: 700; color: var(--source-pota, #4ecca3); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
    .act-log-empty { padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 12px; }

  </style>
</head>
<body data-view="both">
  <div class="titlebar">
    <div class="titlebar-title">Activation</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="tb-min" title="Minimize">&#x2014;</button>
      <button class="titlebar-btn" id="tb-max" title="Maximize">&#x25A1;</button>
      <button class="titlebar-btn titlebar-close" id="tb-close" title="Close">&#x2715;</button>
    </div>
  </div>
  <div class="act-toolbar">
    <span class="act-park" id="act-park">No activation</span>
    <span class="act-count" id="qso-counter" title="A POTA activation needs 10 contacts">0 QSOs</span>
    <span class="act-status" id="act-status"></span>
    <div class="act-seg" role="group" aria-label="View">
      <button type="button" data-view="map">Map</button>
      <button type="button" data-view="both">Both</button>
      <button type="button" data-view="log">Log</button>
    </div>
    <select class="act-btn" id="act-format" title="Image size for sharing">
      <option value="post">Post 4:5</option>
      <option value="story">Story 9:16</option>
    </select>
    <button type="button" class="act-btn" id="act-save" title="Save a shareable image of this activation (PNG)">Save image</button>
    <button type="button" class="act-btn" id="act-copy" title="Copy the shareable image to the clipboard">Copy</button>
  </div>
  <div id="act-main">
    <div id="map-pane">
      <div id="map"></div>
    </div>
    <div id="log-pane">
      <table class="act-log">
        <thead><tr><th>#</th><th>UTC</th><th>Call</th><th>Band</th><th>Mode</th><th>Sent</th><th>Rcvd</th><th>State</th></tr></thead>
        <tbody id="act-log-body"></tbody>
      </table>
      <div class="act-log-empty" id="act-log-empty">No contacts logged yet.</div>
    </div>
  </div>
  <script src="../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="actmap-popout.js"></script>
</body>
</html>
