<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="popout-theme-boot.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org;">
  <title>APRS</title>
  <link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="aprs-popout.css">
  <link rel="stylesheet" href="aprs-listen-bar.css">
  <link rel="stylesheet" href="aprs-beacon-bar.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag"><span class="titlebar-title">APRS</span></div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="tb-min" title="Minimize">&#x2014;</button>
      <button class="titlebar-btn" id="tb-max" title="Maximize">&#x25A1;</button>
      <button class="titlebar-btn titlebar-close" id="tb-close" title="Close">&#x2715;</button>
    </div>
  </div>

  <div class="aprs-bar">
    <span class="aprs-mark" id="aprs-link" title="The internet link to APRS-IS"><span class="aprs-dot" id="aprs-link-dot"></span><span id="aprs-link-text">Starting</span></span>
    <span class="aprs-mark" id="aprs-rate" title="Packets received in the last minute">0 packets a minute</span>
    <span class="aprs-mark" id="aprs-last" title="Time since the last packet">No packets yet</span>
    <span class="aprs-spacer"></span>
    <label class="aprs-range" title="How far from your grid square APRS-IS sends stations">Range
      <select id="aprs-range"></select>
    </label>
    <input type="search" id="aprs-search" placeholder="Search callsign or comment" spellcheck="false" autocomplete="off">
  </div>

  <div class="aprs-listen" id="aprs-listen">
    <label class="aprs-switch" title="Tune your radio to APRS and decode what it hears. Receive only: nothing is transmitted.">
      <input type="checkbox" id="aprs-listen-on"><span class="aprs-switch-track"></span>Listen on my radio
    </label>
    <span class="aprs-bands" id="aprs-listen-bands" role="group" aria-label="The band your radio listens on"></span>
    <span class="aprs-mark hidden" id="aprs-listen-freq"></span>
    <span class="aprs-mark hidden" id="aprs-listen-state"><span class="aprs-dot" id="aprs-listen-dot"></span><span id="aprs-listen-text"></span></span>
    <span class="aprs-mark hidden" id="aprs-listen-heard"><span id="aprs-listen-last"></span><span id="aprs-listen-count"></span></span>
    <span class="aprs-listen-why hidden" id="aprs-listen-why"></span>
    <span class="aprs-mark hidden" id="aprs-igate" title="Report what I hear to APRS-IS (iGate): Settings, Idle Mode, APRS"><span class="aprs-dot" id="aprs-igate-dot"></span><span id="aprs-igate-text"></span></span>
    <span class="aprs-spacer"></span>
    <label class="aprs-heard-filter" title="Show only the stations your radio heard"><input type="checkbox" id="aprs-heard-only">Heard by me</label>
    <div class="aprs-listen-note hidden" id="aprs-listen-note"></div>
  </div>

  <div class="aprs-beacon" id="aprs-beacon" role="group" aria-label="Beacon">
    <span class="aprs-beacon-title" title="Your position to APRS-IS, over the internet. Nothing is transmitted on the air.">Beacon</span>
    <button type="button" class="aprs-btn" id="aprs-beacon-now" title="Send your position to APRS-IS now">Beacon now</button>
    <label class="aprs-field" title="Send your position every so often while this window is open">Timer
      <select id="aprs-beacon-interval">
        <option value="0">Off</option>
        <option value="10">10 min</option>
        <option value="20">20 min</option>
        <option value="30">30 min</option>
      </select>
    </label>
    <span class="aprs-beacon-syms" id="aprs-beacon-syms" role="radiogroup" aria-label="Symbol"></span>
    <div class="aprs-beacon-row">
      <label class="aprs-field">Comment <input type="text" id="aprs-beacon-comment" maxlength="43" spellcheck="false" autocomplete="off"></label>
      <label class="aprs-check" title="Rounds your position to the nearest minute, about 1 nautical mile (APRS position ambiguity)"><input type="checkbox" id="aprs-beacon-approx">Approximate position</label>
      <span class="aprs-mark" id="aprs-beacon-pos"></span>
      <button type="button" class="aprs-btn-quiet" id="aprs-beacon-pick" title="Click the map where you are">Pick on map</button>
      <button type="button" class="aprs-btn-quiet hidden" id="aprs-beacon-grid" title="Use the centre of the grid square in Settings">Use my grid</button>
    </div>
    <div class="aprs-beacon-row"><span class="aprs-mark hidden" id="aprs-beacon-status"><span class="aprs-dot" id="aprs-beacon-dot"></span><span id="aprs-beacon-text"></span></span></div>
  </div>

  <div class="aprs-main">
    <div class="aprs-map-wrap">
      <div id="aprs-map"></div>
      <div class="aprs-legend" id="aprs-legend"></div>
      <div class="aprs-empty hidden" id="aprs-empty"></div>
    </div>
    <div class="aprs-side">
      <div class="aprs-count" id="aprs-count">No stations yet</div>
      <div class="aprs-table-wrap" id="aprs-table-wrap">
        <table class="aprs-table">
          <colgroup><col class="c-sym"><col class="c-call"><col class="c-dist"><col class="c-brg"><col class="c-age"><col></colgroup>
          <thead>
            <tr>
              <th data-sort="symbol" class="col-sym" title="Sort by kind"></th>
              <th data-sort="call">Station</th>
              <th data-sort="distance" class="num">Distance</th>
              <th data-sort="bearing" class="num">Bearing</th>
              <th data-sort="age" class="num">Heard</th>
              <th data-sort="comment">Comment</th>
            </tr>
          </thead>
          <tbody id="aprs-rows"></tbody>
        </table>
      </div>
      <div class="aprs-detail hidden" id="aprs-detail"></div>
    </div>
  </div>

  <script src="../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="../lib/aprs-parser.js"></script>
  <script src="../lib/aprs-symbols.js"></script>
  <script src="../lib/aprs-stations.js"></script>
  <script src="../lib/aprs-map.js"></script>
  <script src="aprs-icons.js"></script>
  <script src="aprs-popout.js"></script>
  <script src="aprs-listen-bar.js"></script>
  <script src="../lib/aprs-beacon.js"></script>
  <script src="aprs-beacon-bar.js"></script>
</body>
</html>
