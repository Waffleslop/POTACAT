name: Build & Release

# Triggers on a v*.*.* tag push or manual dispatch.
# To release: bump package.json, commit, tag, push tag:
#   git tag v1.6.0 && git push origin v1.6.0
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.6.0). Must match package.json.'
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub release and upload assets

jobs:
  # --------------------------------------------------------------------------
  # Parallel platform builds
  # --------------------------------------------------------------------------

  build-windows:
    # Pin to windows-2022. GitHub flipped windows-latest to Windows Server
    # 2025 (build 10.0.26100) on 2026-05-05, and the new image's Visual
    # Studio layout doesn't satisfy node-gyp's heuristics — @electron/rebuild
    # of @serialport/bindings-cpp fails with "Could not find any Visual
    # Studio installation to use". v1.5.14 (May 4, on the old image) was
    # fine; v1.5.15 (May 5, on the new image) failed. Re-evaluate when
    # windows-2022 is retired.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm ci (not install): caret ranges + npm install meant every release
      # was built with whatever electron-builder/NSIS template was newest that
      # day — two releases from identical repos could ship different
      # installers, and an upstream regression could appear with no repo
      # change (suspected in the v1.9.4 Windows assisted-installer UAC-loop
      # report). ci installs exactly what package-lock.json pins, so
      # installers are reproducible; toolchain bumps are now deliberate
      # lockfile commits.
      - name: Install dependencies
        run: npm ci
      - name: Build native addons
        run: npm run build-natives
        continue-on-error: true # native build failures don't block the release
      - name: Set up MSYS2 (for wsprd)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-fftw
      - name: Build wsprd (WSPR decoder — GPLv3 separate exe; packaged users had none, #wsprd)
        shell: msys2 {0}
        run: |
          gfortran -O3 -o assets/wsprd/wsprd.exe third_party/wsprd/src/*.c third_party/wsprd/src/*.f90 -lfftw3f -lm -static
          test -f assets/wsprd/wsprd.exe
      - name: Fetch cloudflared (POTACAT Cloud tunnel binary)
        run: node scripts/fetch-cloudflared.js --platform=win
      - name: Build Windows installers
        # --publish never: electron-builder sees the git tag and otherwise
        # tries to auto-publish to GitHub. The create-release job handles
        # uploads explicitly so we disable the implicit behavior here.
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/POTACAT-Setup-*.exe
            dist/POTACAT-Portable-*.exe
            dist/latest.yml
          if-no-files-found: error

  # macOS Apple Silicon (arm64).
  build-macos-arm64:
    runs-on: macos-latest # arm64 on the M-series runner image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci # lockfile-pinned — see build-windows for why
      - name: Build native addons
        run: npm run build-natives
        continue-on-error: true # freedv/rade are known-broken on mac; ft8 is gated below
      - name: Verify ft8_native exists and is arm64
        # Mirror of the x64 job's gate — a missing/wrong-arch FT8 decoder
        # must stop the release rather than ship silent WASM fallback.
        run: |
          set -e
          NODE_FILE=lib/ft8_native/build/Release/ft8_native.node
          test -f "$NODE_FILE"
          lipo -archs "$NODE_FILE"
          lipo -archs "$NODE_FILE" | grep -q arm64
      - name: Verify js8_native exists and is arm64
        # JS8 has NO WASM fallback (unlike FT8), so a missing/wrong-arch addon
        # ships a JS8 button that opens a decoder-less window with no warning
        # (K3SBP field report, mac 2026-08-09). Gate it like ft8_native.
        run: |
          set -e
          NODE_FILE=lib/js8_native/build/Release/js8_native.node
          test -f "$NODE_FILE"
          lipo -archs "$NODE_FILE"
          lipo -archs "$NODE_FILE" | grep -q arm64
      - name: Bundle hamlib into assets/hamlib/
        run: |
          set -e
          brew install hamlib
          HAMLIB_PREFIX=$(brew --prefix hamlib)
          rm -f assets/hamlib/*.dll assets/hamlib/*.exe
          cp "$HAMLIB_PREFIX/bin/rigctld" assets/hamlib/rigctld
          # Homebrew bakes ABSOLUTE Cellar paths into rigctld, so the copy
          # above still loads /opt/homebrew/Cellar/hamlib/<ver>/lib/... — a
          # path that exists on this runner and on no user's Mac. The script
          # ships libhamlib/libusb alongside it, repoints the load commands at
          # @loader_path, and FAILS THE BUILD if any absolute path survives.
          # Hand-rolling that in shell is exactly what shipped a rigctld no
          # Mac could launch, from the first release pipeline commit until
          # WB0MMC reported "No rigs found" on 2026-08-31.
          node scripts/bundle-mac-deps.js --expect-arch=arm64 assets/hamlib/rigctld
          ls -la assets/hamlib/
      - name: Build wsprd (WSPR decoder — GPLv3 separate exe)
        # NOTE: built for the RUNNER arch. On the cross-compiled x64 job this
        # bundles an arm64 wsprd — same known gap as hamlib there (tracked in
        # potacat-meta work/open/macos-x64-hamlib-arch.md).
        run: |
          brew install fftw gcc
          gfortran -O3 -o assets/wsprd/wsprd third_party/wsprd/src/*.c third_party/wsprd/src/*.f90 -I"$(brew --prefix fftw)/include" "$(brew --prefix fftw)/lib/libfftw3f.a" -lm -static-libgfortran -static-libgcc
          test -f assets/wsprd/wsprd
          # -static-libgfortran/-static-libgcc do NOT cover libquadmath: wsprd
          # shipped linked to /opt/homebrew/opt/gcc/.../libquadmath.0.dylib and
          # died in dyld on every Mac, exactly the way rigctld did (found
          # 2026-08-31 while fixing that one). assets/wsprd's extraResources
          # filter already ships *.dylib, so the bundled copy rides along.
          node scripts/bundle-mac-deps.js --expect-arch=arm64 assets/wsprd/wsprd
      - name: Fetch cloudflared (POTACAT Cloud tunnel binary)
        run: node scripts/fetch-cloudflared.js --platform=mac --arch=arm64
      - name: Build macOS dmg (arm64)
        run: npx electron-builder --mac --arm64 --publish never --config builder-config.js
        # Signing + notarization are GATED on these secrets. Absent (today) =>
        # empty strings => electron-builder ad-hoc signs and scripts/notarize.js
        # skips, i.e. the current unsigned build, unchanged. Present => a
        # Developer ID signed + notarized build with working auto-update.
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Rename channel file so it survives artifact staging
        # Both mac jobs write "latest-mac.yml" (electron-builder's channel
        # filename is fixed per-OS, NOT per-arch). Staged together, one copy
        # clobbered the other — a per-release arch coin flip (x64 won 1.10.5,
        # .6, .8, .9, .11, .12; arm64 won 1.10.10), which broke Intel
        # auto-update outright when arm64 won and put Apple Silicon under
        # Rosetta when x64 won. Rename here; create-release merges them back
        # into the one latest-mac.yml electron-updater actually fetches.
        run: mv dist/latest-mac.yml dist/latest-mac-arm64.yml
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: |
            dist/POTACAT-*-arm64.dmg
            dist/POTACAT-*-arm64.dmg.blockmap
            dist/POTACAT-*-arm64*.zip
            dist/POTACAT-*-arm64*.zip.blockmap
            dist/latest-mac-arm64.yml
          if-no-files-found: error

  # macOS Intel (x86_64) build — CROSS-COMPILED from an Apple Silicon host.
  # GitHub retired the Intel runners (macos-13 was the last bare-label Intel
  # image); despite this job's old comment, `macos-14` is ARM64. A plain
  # `node-gyp rebuild` here therefore produced arm64 .node files inside the
  # x64 DMG — an Intel Mac can't load them, so ft8_native silently fell back
  # to the slow WASM decoder (N3VD 2026-07-10, late-start TX every cycle).
  # `--arch=x64` makes gyp emit ARCHS=x86_64; the verify step below fails the
  # release if the shipped decoder is ever the wrong arch again.
  # KNOWN GAP: `brew install hamlib` on this ARM host bundles arm64 rigctld
  # into the x64 DMG — tracked in potacat-meta work/open/macos-x64-hamlib-arch.md.
  build-macos-x64:
    runs-on: macos-14 # ARM64 host — x64 artifacts are cross-compiled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci # lockfile-pinned — see build-windows for why
      - name: Build native addons (cross-compiled for x64)
        run: npm run build-natives -- --arch=x64
        continue-on-error: true # freedv/rade are known-broken on mac; ft8 is gated below
      - name: Verify ft8_native exists and is x86_64
        # ft8_native is load-bearing (FT8 decode speed → TX timing). A wrong-
        # arch or missing .node must STOP the release, not ship a WASM-only
        # build that degrades silently in the field.
        run: |
          set -e
          NODE_FILE=lib/ft8_native/build/Release/ft8_native.node
          test -f "$NODE_FILE"
          lipo -archs "$NODE_FILE"
          lipo -archs "$NODE_FILE" | grep -q x86_64
      - name: Verify js8_native exists and is x86_64
        # JS8 has no WASM fallback — a missing addon = a dead JS8 window. Gate
        # it like ft8_native so a silent mac compile failure stops the release.
        run: |
          set -e
          NODE_FILE=lib/js8_native/build/Release/js8_native.node
          test -f "$NODE_FILE"
          lipo -archs "$NODE_FILE"
          lipo -archs "$NODE_FILE" | grep -q x86_64
      - name: Bundle hamlib into assets/hamlib/
        # Same script as the arm64 job. NOTE the runner is ARM (macos-14),
        # so brew installs the arm64 formula — the bundled rigctld is arm64
        # inside the Intel DMG and the gate warns about it every build
        # (potacat-meta work/open/macos-x64-hamlib-arch.md).
        run: |
          set -e
          brew install hamlib
          HAMLIB_PREFIX=$(brew --prefix hamlib)
          rm -f assets/hamlib/*.dll assets/hamlib/*.exe
          cp "$HAMLIB_PREFIX/bin/rigctld" assets/hamlib/rigctld
          # Homebrew bakes ABSOLUTE Cellar paths into rigctld, so the copy
          # above still loads /opt/homebrew/Cellar/hamlib/<ver>/lib/... — a
          # path that exists on this runner and on no user's Mac. The script
          # ships libhamlib/libusb alongside it, repoints the load commands at
          # @loader_path, and FAILS THE BUILD if any absolute path survives.
          # Hand-rolling that in shell is exactly what shipped a rigctld no
          # Mac could launch, from the first release pipeline commit until
          # WB0MMC reported "No rigs found" on 2026-08-31.
          node scripts/bundle-mac-deps.js --expect-arch=x86_64 assets/hamlib/rigctld
          ls -la assets/hamlib/
      - name: Build wsprd (WSPR decoder — GPLv3 separate exe)
        # NOTE: built for the RUNNER arch. On the cross-compiled x64 job this
        # bundles an arm64 wsprd — same known gap as hamlib there (tracked in
        # potacat-meta work/open/macos-x64-hamlib-arch.md).
        run: |
          brew install fftw gcc
          gfortran -O3 -o assets/wsprd/wsprd third_party/wsprd/src/*.c third_party/wsprd/src/*.f90 -I"$(brew --prefix fftw)/include" "$(brew --prefix fftw)/lib/libfftw3f.a" -lm -static-libgfortran -static-libgcc
          test -f assets/wsprd/wsprd
          # -static-libgfortran/-static-libgcc do NOT cover libquadmath: wsprd
          # shipped linked to /opt/homebrew/opt/gcc/.../libquadmath.0.dylib and
          # died in dyld on every Mac, exactly the way rigctld did (found
          # 2026-08-31 while fixing that one). assets/wsprd's extraResources
          # filter already ships *.dylib, so the bundled copy rides along.
          node scripts/bundle-mac-deps.js --expect-arch=x86_64 assets/wsprd/wsprd
      - name: Fetch cloudflared (POTACAT Cloud tunnel binary)
        run: node scripts/fetch-cloudflared.js --platform=mac --arch=x64
      - name: Build macOS dmg (x64)
        # electron-builder writes latest-mac.yml naming ONLY this arch's
        # files (there is no per-arch channel filename — an earlier comment
        # here claimed a latest-mac-x64.yml that never existed). This job's
        # copy stays canonical; the arm64 job renames its copy and
        # create-release merges the two so the published manifest lists both
        # arches and electron-updater can pick natively per host.
        run: npx electron-builder --mac --x64 --publish never --config builder-config.js
        # Same signing gate as the arm64 job — inert without the secrets.
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x64
          path: |
            dist/POTACAT-*.dmg
            dist/POTACAT-*.dmg.blockmap
            dist/POTACAT-*.zip
            dist/POTACAT-*.zip.blockmap
            dist/latest-mac*.yml
          if-no-files-found: error

  build-linux:
    # Pinned to 22.04 (glibc 2.35) so the alsa_native addon doesn't
    # require a glibc symbol newer than what Raspberry Pi OS Bookworm
    # (glibc 2.36) and similar LTS distros ship. HA3HZ on Pi 5 Bookworm
    # hit GLIBC_2.38 not-found from a 24.04-built v1.6.1 binary.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system build deps
        # Ubuntu-latest (24.04) ships hamlib 4.5.5, which predates FTX-1
        # support (added in hamlib 4.6, Sept 2024 — royw3888 report).
        # We build hamlib from source below to guarantee a current backend
        # set in the bundled rigctld.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 libudev-dev cmake rpm patchelf \
            autoconf automake libtool texinfo pkg-config \
            libusb-1.0-0-dev libreadline-dev libxml2-dev \
            libasound2-dev
      - name: Build hamlib from source
        env:
          HAMLIB_VERSION: '4.7.1'
        run: |
          set -e
          curl -fsSL "https://github.com/Hamlib/Hamlib/archive/refs/tags/${HAMLIB_VERSION}.tar.gz" -o /tmp/hamlib.tar.gz
          mkdir -p /tmp/hamlib-src
          tar -xzf /tmp/hamlib.tar.gz -C /tmp/hamlib-src --strip-components=1
          cd /tmp/hamlib-src
          ./bootstrap
          ./configure --prefix=/usr/local --disable-static --enable-shared \
            --without-cxx-binding --disable-doxygen-doc
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          /usr/local/bin/rigctld --version
          # Sanity check — fail the build if FTX-1 isn't in the model list,
          # which is the whole point of building from source.
          /usr/local/bin/rigctl --list | grep -i 'FTX-1' || (echo "FTX-1 missing from rigctl --list" && exit 1)
      - name: Install dependencies
        run: npm ci # lockfile-pinned — see build-windows for why
      - name: Build native addons
        run: npm run build-natives
        continue-on-error: true
      # Same hard-fail check as the arm64 job — see comments there.
      - name: Confirm alsa_native built + loads + can openCapture
        run: |
          set -e
          ls -la lib/alsa_native/build/Release/
          file lib/alsa_native/build/Release/alsa_native.node
          # GLIBC compatibility floor — Pi OS Bookworm ships glibc 2.36,
          # and we want the addon to load on any distro >= that. The 22.04
          # runners we use have glibc 2.35, so a clean build will only
          # require <= 2.35 symbols. Anything higher is a regression
          # (e.g. a newer build host slipping in, or a dependency dragging
          # in a 2.36+ symbol). HA3HZ v1.6.1 example: GLIBC_2.38.
          ADDON=lib/alsa_native/build/Release/alsa_native.node
          MAX_GLIBC=$(objdump -T "$ADDON" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Highest GLIBC symbol required by addon: ${MAX_GLIBC:-none}"
          # 2.35 is what 22.04 provides; require <= that.
          if [ -n "$MAX_GLIBC" ]; then
            MAX_NUM=$(echo "$MAX_GLIBC" | sed 's/GLIBC_//')
            if [ "$(printf '%s\n%s\n' "$MAX_NUM" "2.35" | sort -V | tail -1)" != "2.35" ]; then
              echo "FAIL: addon requires $MAX_GLIBC > GLIBC_2.35 — won't load on Bookworm-class distros"
              exit 1
            fi
          fi
          node -e "
            const a = require('./lib/alsa');
            console.log('alsa available:', a.isAvailable(), 'version:', a._alsaVersion());
            if (!a.isAvailable()) { console.error('alsa_native loaded but not available'); process.exit(1); }
            const native = require('./lib/alsa_native/build/Release/alsa_native.node');
            const cap = native.openCapture('null', { rate: 48000, channels: 1, periodFrames: 1024, bufferFrames: 4096 });
            console.log('openCapture(null) ok — handle=', cap.handle, 'rate=', cap.rate);
            native.closeCapture(cap.handle);
            console.log('closeCapture ok');
          "
      - name: Bundle hamlib into assets/hamlib/
        # Replaces Windows binaries with the freshly-built Linux rigctld
        # + its hamlib/libusb deps, rewriting RPATH to $ORIGIN so libs
        # resolve next to the binary.
        run: |
          set -e
          rm -f assets/hamlib/*.dll assets/hamlib/*.exe
          cp /usr/local/bin/rigctld assets/hamlib/rigctld
          # 755, NOT just +x: Homebrew installs binaries 555 and cp preserves
          # that. A file without owner-write breaks Squirrel.Mac auto-update —
          # ShipIt must strip the quarantine xattr from every file in the
          # downloaded zip and removexattr needs u+w; one read-only file fails
          # the whole install and silently relaunches the old version (W3DFX,
          # 1.10.3 -> 1.10.5, ShipIt_stderr.log: "Permission denied ...
          # hamlib/rigctld ... file is read-only").
          chmod 755 assets/hamlib/rigctld
          for dep in $(ldd /usr/local/bin/rigctld | awk '/(hamlib|libusb)/ {print $3}'); do
            if [ -f "$dep" ]; then
              cp -L "$dep" "assets/hamlib/$(basename $dep)"
            fi
          done
          patchelf --set-rpath '$ORIGIN' assets/hamlib/rigctld
          for lib in assets/hamlib/*.so*; do
            [ -f "$lib" ] && patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
          done
          ls -la assets/hamlib/
      - name: Build wsprd (WSPR decoder — GPLv3 separate exe)
        run: |
          sudo apt-get update && sudo apt-get install -y libfftw3-dev gfortran
          gfortran -O3 -o assets/wsprd/wsprd third_party/wsprd/src/*.c third_party/wsprd/src/*.f90 -Wl,-Bstatic -lfftw3f -Wl,-Bdynamic -lm -static-libgfortran -static-libgcc
          test -f assets/wsprd/wsprd
      - name: Fetch cloudflared (POTACAT Cloud tunnel binary)
        run: node scripts/fetch-cloudflared.js --platform=linux --arch=x64
      - name: Build Linux packages
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/POTACAT-*.AppImage
            dist/potacat_*.deb
            dist/potacat-*.rpm
            dist/latest-linux.yml
          if-no-files-found: error

  # Linux arm64 (aarch64) — Raspberry Pi / sBitx / other ARM SBCs.
  # Native build on GitHub's free public-repo ARM runner; no QEMU cross-compile.
  # Modern Raspberry Pi OS is 64-bit, so arm64 is the right (and only) ARM
  # target — Electron no longer ships 32-bit armv7l Linux binaries.
  build-linux-arm64:
    # 22.04-arm (glibc 2.35) — see comment on build-linux. v1.6.1 shipped
    # against 24.04's glibc 2.39, which won't load on Pi OS Bookworm
    # (2.36) or any LTS distro older than ~mid-2024.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 libudev-dev cmake rpm patchelf \
            autoconf automake libtool texinfo pkg-config \
            libusb-1.0-0-dev libreadline-dev libxml2-dev \
            libasound2-dev
      - name: Build hamlib from source
        env:
          HAMLIB_VERSION: '4.7.1'
        run: |
          set -e
          curl -fsSL "https://github.com/Hamlib/Hamlib/archive/refs/tags/${HAMLIB_VERSION}.tar.gz" -o /tmp/hamlib.tar.gz
          mkdir -p /tmp/hamlib-src
          tar -xzf /tmp/hamlib.tar.gz -C /tmp/hamlib-src --strip-components=1
          cd /tmp/hamlib-src
          ./bootstrap
          ./configure --prefix=/usr/local --disable-static --enable-shared \
            --without-cxx-binding --disable-doxygen-doc
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          /usr/local/bin/rigctld --version
          /usr/local/bin/rigctl --list | grep -i 'FTX-1' || (echo "FTX-1 missing from rigctl --list" && exit 1)
      - name: Install dependencies
        run: npm ci # lockfile-pinned — see build-windows for why
      - name: Build native addons
        run: npm run build-natives
        continue-on-error: true
      # alsa_native is critical for the arm64 build's primary audience
      # (Raspberry Pi / sBitx users). build-natives has continue-on-error
      # for optional addons (FreeDV codec2 etc.), which silently shipped
      # v1.6.0 without the alsa addon when a binding.gyp parse error
      # broke the build. Explicit hard-fail here means a regression in
      # alsa_native blocks the release instead of slipping through.
      - name: Confirm alsa_native built + loads + can openCapture
        run: |
          set -e
          ls -la lib/alsa_native/build/Release/
          file lib/alsa_native/build/Release/alsa_native.node
          # GLIBC compatibility floor — Pi OS Bookworm ships glibc 2.36,
          # and we want the addon to load on any distro >= that. The 22.04
          # runners we use have glibc 2.35, so a clean build will only
          # require <= 2.35 symbols. Anything higher is a regression
          # (e.g. a newer build host slipping in, or a dependency dragging
          # in a 2.36+ symbol). HA3HZ v1.6.1 example: GLIBC_2.38.
          ADDON=lib/alsa_native/build/Release/alsa_native.node
          MAX_GLIBC=$(objdump -T "$ADDON" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Highest GLIBC symbol required by addon: ${MAX_GLIBC:-none}"
          # 2.35 is what 22.04 provides; require <= that.
          if [ -n "$MAX_GLIBC" ]; then
            MAX_NUM=$(echo "$MAX_GLIBC" | sed 's/GLIBC_//')
            if [ "$(printf '%s\n%s\n' "$MAX_NUM" "2.35" | sort -V | tail -1)" != "2.35" ]; then
              echo "FAIL: addon requires $MAX_GLIBC > GLIBC_2.35 — won't load on Bookworm-class distros"
              exit 1
            fi
          fi
          node -e "
            const a = require('./lib/alsa');
            console.log('alsa available:', a.isAvailable(), 'version:', a._alsaVersion());
            if (!a.isAvailable()) { console.error('alsa_native loaded but not available'); process.exit(1); }
            const native = require('./lib/alsa_native/build/Release/alsa_native.node');
            const cap = native.openCapture('null', { rate: 48000, channels: 1, periodFrames: 1024, bufferFrames: 4096 });
            console.log('openCapture(null) ok — handle=', cap.handle, 'rate=', cap.rate);
            native.closeCapture(cap.handle);
            console.log('closeCapture ok');
          "
      - name: Bundle hamlib into assets/hamlib/
        run: |
          set -e
          rm -f assets/hamlib/*.dll assets/hamlib/*.exe
          cp /usr/local/bin/rigctld assets/hamlib/rigctld
          # 755, NOT just +x: Homebrew installs binaries 555 and cp preserves
          # that. A file without owner-write breaks Squirrel.Mac auto-update —
          # ShipIt must strip the quarantine xattr from every file in the
          # downloaded zip and removexattr needs u+w; one read-only file fails
          # the whole install and silently relaunches the old version (W3DFX,
          # 1.10.3 -> 1.10.5, ShipIt_stderr.log: "Permission denied ...
          # hamlib/rigctld ... file is read-only").
          chmod 755 assets/hamlib/rigctld
          for dep in $(ldd /usr/local/bin/rigctld | awk '/(hamlib|libusb)/ {print $3}'); do
            if [ -f "$dep" ]; then
              cp -L "$dep" "assets/hamlib/$(basename $dep)"
            fi
          done
          patchelf --set-rpath '$ORIGIN' assets/hamlib/rigctld
          for lib in assets/hamlib/*.so*; do
            [ -f "$lib" ] && patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
          done
          ls -la assets/hamlib/
      - name: Build wsprd (WSPR decoder — GPLv3 separate exe)
        run: |
          sudo apt-get update && sudo apt-get install -y libfftw3-dev gfortran
          gfortran -O3 -o assets/wsprd/wsprd third_party/wsprd/src/*.c third_party/wsprd/src/*.f90 -Wl,-Bstatic -lfftw3f -Wl,-Bdynamic -lm -static-libgfortran -static-libgcc
          test -f assets/wsprd/wsprd
      - name: Fetch cloudflared (POTACAT Cloud tunnel binary)
        run: node scripts/fetch-cloudflared.js --platform=linux --arch=arm64
      - name: Build Linux packages (arm64)
        run: npx electron-builder --linux --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64
          path: |
            dist/POTACAT-*-arm64.AppImage
            dist/potacat_*_arm64.deb
            dist/potacat-*.aarch64.rpm
            dist/latest-linux-arm64.yml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Collect artifacts + create the GitHub release
  # --------------------------------------------------------------------------

  create-release:
    needs: [build-windows, build-macos-arm64, build-macos-x64, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gh can auto-generate notes
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for v$VERSION"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-download
          merge-multiple: true
      - name: Stage artifacts in dist/
        run: |
          mkdir -p dist
          cp -v dist-download/* dist/ || true
          ls -la dist/
      - name: Merge per-arch mac channel files into one latest-mac.yml
        # See the rename step in build-macos-arm64. Both files MUST exist —
        # a missing manifest fails the release loudly instead of shipping a
        # single-arch coin-flip manifest again.
        run: |
          test -f dist/latest-mac.yml
          test -f dist/latest-mac-arm64.yml
          node scripts/merge-latest-mac.js dist/latest-mac.yml dist/latest-mac-arm64.yml
      - name: Create GitHub release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # If a release notes file is checked in at release-notes/vX.Y.Z.md, use it.
          # Otherwise let gh auto-generate from commits since the previous tag.
          NOTES_FILE="release-notes/${TAG}.md"
          # Optional human-friendly release name in release-notes/vX.Y.Z.title
          # (one line). Falls back to the tag, so a release can be titled
          # "POTACAT with …" instead of just "v1.9.0".
          TITLE_FILE="release-notes/${TAG}.title"
          if [ -f "$TITLE_FILE" ]; then TITLE=$(head -1 "$TITLE_FILE"); else TITLE="$TAG"; fi
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              dist/POTACAT-Setup-*.exe dist/POTACAT-Portable-*.exe \
              dist/POTACAT-*.dmg dist/POTACAT-*.zip \
              dist/POTACAT-*.AppImage dist/potacat_*.deb dist/potacat-*.rpm \
              dist/latest*.yml 2>/dev/null || \
            gh release upload "$TAG" \
              dist/POTACAT-Setup-*.exe dist/POTACAT-Portable-*.exe \
              dist/POTACAT-*.dmg dist/POTACAT-*.zip \
              dist/POTACAT-*.AppImage dist/potacat_*.deb dist/potacat-*.rpm \
              dist/latest*.yml --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --generate-notes \
              dist/POTACAT-Setup-*.exe dist/POTACAT-Portable-*.exe \
              dist/POTACAT-*.dmg dist/POTACAT-*.zip \
              dist/POTACAT-*.AppImage dist/potacat_*.deb dist/potacat-*.rpm \
              dist/latest*.yml 2>/dev/null || \
            gh release upload "$TAG" \
              dist/POTACAT-Setup-*.exe dist/POTACAT-Portable-*.exe \
              dist/POTACAT-*.dmg dist/POTACAT-*.zip \
              dist/POTACAT-*.AppImage dist/potacat_*.deb dist/potacat-*.rpm \
              dist/latest*.yml --clobber
          fi

  # --------------------------------------------------------------------------
  # Update the website to point at the new installers
  # --------------------------------------------------------------------------

  update-website:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POTACAT (for the update script)
        uses: actions/checkout@v4
        with:
          path: potacat
      - name: Checkout potacat-website
        uses: actions/checkout@v4
        with:
          repository: Waffleslop/potacat-website
          token: ${{ secrets.WEBSITE_UPDATE_TOKEN }}
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update download links in index.html
        run: node potacat/scripts/update-website-links.js "${{ needs.create-release.outputs.version }}" website/index.html
      - name: Commit and push
        working-directory: website
        run: |
          git config user.name "POTACAT Release Bot"
          git config user.email "noreply@potacat.com"
          if git diff --quiet; then
            echo "No website changes (already up to date)"
            exit 0
          fi
          git add index.html
          git commit -m "Update download links to v${{ needs.create-release.outputs.version }}"
          git push
