# Builds the Winlink sidecars (Pat, ardopcf, Dire Wolf) on every release
# runner WITHOUT cutting a release, with the same script the release jobs run
# (scripts/build-winlink-helpers.sh). A release is the wrong place to find out
# that Dire Wolf will not link the Hamlib zip on Windows. Triggers on a change
# to the script, the ardopcf patch and its sources, the pinned versions, or
# this file, and on demand (the release skill dispatches it). Then smoke-tests
# each binary.
name: winlink helpers
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-winlink-helpers.sh'
      - 'scripts/gen-ardopcf-patch.py'
      - 'scripts/gen-direwolf-patch.py'
      - 'helpers/alsa-stub/**'
      - 'third_party/ardopcf/**'
      - 'third_party/pat/**'
      - 'third_party/direwolf/**'
      - '.github/workflows/winlink-helpers.yml'
      - 'test/modem-loopback/**'
      - 'lib/modem-audio-server.js'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Pat
        shell: bash
        run: bash scripts/build-winlink-helpers.sh pat
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make git unzip
      - name: ardopcf + Dire Wolf
        shell: msys2 {0}
        run: bash scripts/build-winlink-helpers.sh ardop direwolf
      - name: Smoke test
        shell: bash
        run: |
          set -e
          ./assets/pat/pat.exe version
          ./assets/ardopcf/ardopcf.exe -h | head -3 || true
          ls -la assets/direwolf
          ./assets/direwolf/direwolf.exe -h 2>&1 | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: winlink-helpers-windows
          path: |
            assets/pat/pat.exe
            assets/ardopcf/ardopcf.exe
            assets/direwolf/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modem loopback, two modems and no radio (docs/ardop-macos-plan.md L1 + L2, #187)
        shell: bash
        env:
          LOOPBACK_REQUIRED: '1'
        timeout-minutes: 25
        run: node test/modem-loopback/run.js --out loopback-results.json --logs loopback-logs
      - name: Electron for the bridge checks
        if: always()
        shell: bash
        run: npm ci --no-audit --no-fund
      - name: Hidden bridge window keeps the modem fed (L4, #187; 2 min as POTACAT runs it, 2 min with main frozen 200 ms every second)
        if: always()
        timeout-minutes: 12
        shell: bash
        run: node test/modem-loopback/bridge-check.js --seconds 120 --out bridge-results.json
      - name: Real ARDOP frames through the bridge capture and playback (L3, #187)
        if: always()
        timeout-minutes: 8
        shell: bash
        env:
          LOOPBACK_REQUIRED: '1'
        run: node test/modem-loopback/l3-check.js --out l3-results.json --logs l3-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modem-loopback-windows
          path: |
            loopback-results.json
            loopback-logs/
            bridge-results.json
            l3-results.json
            l3-logs/
          if-no-files-found: warn

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build all three
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libhamlib-dev cmake patchelf
          bash scripts/build-winlink-helpers.sh pat ardop direwolf
      - name: Smoke test
        run: |
          set -e
          ./assets/pat/pat version
          ./assets/ardopcf/ardopcf -h | head -3 || true
          ldd assets/direwolf/direwolf | grep -i hamlib
          ./assets/direwolf/direwolf -h 2>&1 | head -3 || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modem loopback, two modems and no radio (docs/ardop-macos-plan.md L1 + L2, #187)
        shell: bash
        env:
          LOOPBACK_REQUIRED: '1'
        timeout-minutes: 25
        run: node test/modem-loopback/run.js --out loopback-results.json --logs loopback-logs
      - name: Electron for the bridge checks
        if: always()
        run: npm ci --no-audit --no-fund
      - name: Hidden bridge window keeps the modem fed (L4, #187; 2 min as POTACAT runs it, 2 min with main frozen 200 ms every second)
        if: always()
        timeout-minutes: 12
        run: xvfb-run -a node test/modem-loopback/bridge-check.js --seconds 120 --out bridge-results.json
      - name: Real ARDOP frames through the bridge capture and playback (L3, #187)
        if: always()
        timeout-minutes: 8
        env:
          LOOPBACK_REQUIRED: '1'
        run: xvfb-run -a node test/modem-loopback/l3-check.js --out l3-results.json --logs l3-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modem-loopback-${{ matrix.runner }}
          path: |
            loopback-results.json
            loopback-logs/
            bridge-results.json
            l3-results.json
            l3-logs/
          if-no-files-found: warn

  mac:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = the release's arm64 host (macos-14 retired 2026-11-02).
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Dire Wolf's build dependencies (PortAudio and hidapi are required by its CMake on macOS; Hamlib for PTT RIG)
        run: brew install portaudio hidapi hamlib
      - name: Pat + ardopcf + Dire Wolf (both modems on POTACAT's socket audio — no CoreAudio needed)
        run: bash scripts/build-winlink-helpers.sh pat ardop direwolf
      - name: Smoke test
        run: |
          ./assets/pat/pat version
          file assets/pat/pat
          file assets/ardopcf/ardopcf
          ./assets/ardopcf/ardopcf -h | head -3 || true
          # ardopcf must accept the socket device and report the connection refusal, not an ALSA error
          # (perl alarm: macOS has no `timeout`; a modem that sat in its main loop would hang the job)
          (perl -e 'alarm 10; exec @ARGV' -- ./assets/ardopcf/ardopcf --hostcommands "CLOSE" 8515 tcp:1 tcp:1 2>&1 || true) | head -20
          (perl -e 'alarm 10; exec @ARGV' -- ./assets/ardopcf/ardopcf --hostcommands "CLOSE" 8515 tcp:1 tcp:1 2>&1 || true) | grep -qi 'socket audio' || { echo "::error::ardopcf did not take the tcp: device"; exit 1; }
          ls -la assets/direwolf
          otool -L assets/direwolf/direwolf
          otool -L assets/direwolf/direwolf | grep -i hamlib
          ./assets/direwolf/direwolf -h 2>&1 | head -3 || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modem loopback, two modems and no radio (docs/ardop-macos-plan.md L1 + L2, #187)
        shell: bash
        env:
          LOOPBACK_REQUIRED: '1'
        timeout-minutes: 25
        run: node test/modem-loopback/run.js --out loopback-results.json --logs loopback-logs
      - name: Electron for the bridge check
        if: always()
        run: npm ci --no-audit --no-fund
      - name: Hidden bridge window keeps the modem fed (L4, #187; 2 min without and 2 min with a power-save blocker)
        if: always()
        timeout-minutes: 12
        run: node test/modem-loopback/bridge-check.js --seconds 120 --out bridge-results.json
      - name: Real ARDOP frames through the bridge capture and playback (L3, #187)
        if: always()
        timeout-minutes: 8
        env:
          LOOPBACK_REQUIRED: '1'
        run: node test/modem-loopback/l3-check.js --out l3-results.json --logs l3-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modem-loopback-${{ matrix.runner }}
          path: |
            loopback-results.json
            loopback-logs/
            bridge-results.json
            l3-results.json
            l3-logs/
          if-no-files-found: warn
