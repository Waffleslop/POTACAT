name: Test

# Runs on every push to master + every PR. The jtcat-tests job runs the
# SAME suite as `npm test` (scripts/run-tests.js: every test file, in order,
# continuing past failures, exit non-zero if any failed). Until 2026-11-07
# this job ran a hand-picked list of ~90 files that had to be edited by hand
# for every new test, and none of the tests added for #136/#142/#143/#174/
# #179/#186 were on it, so "CI green" did not cover them (GitHub #205).
# A new test file goes in scripts/run-tests.js and nowhere else.
#
# Tests that need Electron, a native build or a bundled helper skip
# themselves when that is missing (the layout-tests job covers the rendered
# checks with Electron installed). No live radio.
#
# To gate merges on this passing, enable branch protection in
# GitHub Settings → Branches → master → "Require status checks
# to pass before merging" and tick the "jtcat-tests" job below.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  jtcat-tests:
    runs-on: ubuntu-latest
    # Bumped 5 → 12 (2026-07-09): the SSTV e2e + quality suites pushed the
    # battery past 5 minutes and runs were being CANCELLED at the timeout —
    # master showed "cancelled", not red, which is how it went unnoticed.
    # 12 → 16 (2026-09-26): the SSTV lock-supervision suite adds ~3 min.
    # 16 → 45 (2026-11-07): the whole npm test suite (430+ files) runs here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # same as release.yml; the suite needs ws and serialport from the lockfile
      - name: npm ci (the suite requires ws, serialport and the other runtime deps)
        run: npm ci --no-audit --no-fund
      - name: Run the whole npm test suite (scripts/run-tests.js)
        run: node scripts/run-tests.js
      - name: Validate SSTV style packs in data/sstv-packs
        run: node scripts/validate-sstv-packs.js
      - name: Compile the FT-710 scope helper and round-trip one synthetic frame through the parser
        run: |
          gcc -O2 -Wall -o /tmp/yaesu-scope helpers/yaesu-scope/yaesu-scope.c -ldl -lpthread -lm
          /tmp/yaesu-scope --synth --once > /tmp/scope-frame.bin
          node -e "
            const S = require('./lib/yaesu-scope');
            const st = new S.YaesuScopeStream();
            let n = 0;
            st.on('frame', (f) => { n++; if (!f.aligned || f.kind !== 1) { console.error('bad frame', f.aligned, f.kind); process.exit(1); } });
            st.feed(require('fs').readFileSync('/tmp/scope-frame.bin'));
            if (n !== 1) { console.error('expected 1 frame, got', n); process.exit(1); }
            console.log('helper → parser round trip OK');
          "

  # The FT-710 scope helper finds and loads FTDI's LibFT4222 under FTDI's own
  # file names on macOS and Linux (GitHub #360: on a Mac the library is
  # libft4222.<version>.dylib and needs libftd2xx.dylib beside it). Stand-in
  # libraries, the real helper, no radio. macos-15 is Apple Silicon, like the
  # reporter's Mac and the release's arm64 job.
  ft4222-loader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Helper loads LibFT4222 the way an operator has it installed
        run: bash scripts/test-ft4222-loader.sh

  # The release workflow installs with npm ci (lockfile-pinned), which fails
  # hard if package.json and package-lock.json drift apart. Catch that on the
  # push that introduces the drift instead of at release-tag time.
  # Rendered layout checks (2026-10-22). Two row-layout bugs shipped in
  # 1.11.7–1.13.0 while every test passed, because nothing looked at a page:
  # the CW speed shifted spot-table columns, and FT4's dB arrived as a raw
  # float. This job installs Electron (npm ci), renders the real row builders
  # with the real stylesheets on a virtual display, and measures every cell;
  # LAYOUT_REQUIRED=1 makes "could not render" a failure, never a skip. The
  # decode contract drives the real decoder worker (WASM here; the native
  # addon is not built in this job) and checks every result is screen-ready.
  layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci (installs Electron)
        run: npm ci --no-audit --no-fund
      - name: Virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Web row alignment (source guards)
        run: node test/web-row-alignment-test.js
      - name: Build the native FT8/FT4/FT2 decoder (what users run)
        run: cd lib/ft8_native && ../../node_modules/.bin/node-gyp rebuild
      - name: Decoder output contract (FT8 / FT4 / FT2)
        env:
          NATIVE_REQUIRED: '1'
        run: node test/decode-contract-test.js
      - name: Rendered row alignment (ECHOCAT Web + JTCAT window)
        env:
          LAYOUT_REQUIRED: '1'
        run: xvfb-run -a node test/layout-alignment-test.js
      - name: Modem audio bridge (real bridge window, fake audio device, real modem socket)
        env:
          LAYOUT_REQUIRED: '1'
        run: xvfb-run -a node test/modem-bridge-test.js

  lockfile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # same as release.yml
      - name: npm ci (verifies package-lock.json is in sync)
        run: npm ci --no-audit --no-fund
